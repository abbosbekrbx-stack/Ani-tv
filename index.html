<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Uzbek — anime o'zbek tilida</title>
<meta name="description" content="Sevimli animelaringizni o'zbek tilida tomosha qiling.">
<meta name="theme-color" content="#0d0f1a">
<style>
:root{
  --bg:#0d0f1a; --panel:#151829; --panel2:#1c2036; --line:#272c47;
  --text:#eef0fb; --muted:#9aa0c3;
  --accent:#8b5cf6; --accent2:#ec4899;
  --green:#22c55e; --blue:#2f8cff; --star:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a1b5c55,transparent),
     radial-gradient(900px 500px at -10% 10%,#5c1b4a44,transparent),var(--bg);
     color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:20;background:#0d0f1acc;backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{font-weight:800;font-size:20px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;position:relative;max-width:520px;margin-left:auto}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:11px 14px 11px 40px;font-size:15px;outline:none;transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b5cf633}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.chan{white-space:nowrap;font-size:14px;font-weight:600;padding:10px 14px;border-radius:12px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
@media(max-width:640px){.chan{display:none}.logo{font-size:17px}}

.chips{display:flex;gap:8px;margin:22px 0 18px;flex-wrap:wrap;align-items:center}
.chips h2{font-size:22px;margin-right:auto}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 14px;
  border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(5,1fr);gap:18px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  transition:transform .25s,border-color .25s,box-shadow .25s;cursor:pointer;display:block}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 30px #0008}
.pic{position:relative;aspect-ratio:2/3;background:var(--panel2)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic:after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,#0d0f1aee)}
.badge{position:absolute;z-index:2;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:#0d0f1acc;backdrop-filter:blur(6px)}
.badge.l{left:8px;bottom:8px}
.badge.r{right:8px;bottom:8px;color:var(--star)}
.card h3{font-size:14.5px;font-weight:700;padding:11px 12px 13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.6em}

.skel{aspect-ratio:2/3.6;border-radius:16px;background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:70px 10px}
.empty div{font-size:42px;margin-bottom:8px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;margin:20px 0 6px;color:var(--muted);font-weight:600;cursor:pointer;
  padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.back:hover{color:#fff}
.detail{display:grid;grid-template-columns:1fr;gap:22px;margin:14px 0 50px}
@media(min-width:780px){.detail{grid-template-columns:300px 1fr;gap:34px}}
.dpic{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);aspect-ratio:2/3;max-width:320px;width:100%;margin:0 auto;box-shadow:0 20px 50px #0009}
.dpic img{width:100%;height:100%;object-fit:cover;display:block}
.dinfo h1{font-size:clamp(24px,4vw,36px);line-height:1.15;margin-bottom:12px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.pill b{color:var(--text)}
.pill.star b{color:var(--star)}
.descr{color:#cfd3ee;white-space:pre-line;margin-bottom:22px;font-size:15.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font-weight:700;font-size:15px;border:0;cursor:pointer;color:#fff;transition:.2s;font-family:inherit}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.dinfo h2{font-size:18px;margin-bottom:12px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.ep{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 0;text-align:center;font-weight:700;transition:.2s}
.ep:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.hint{color:var(--muted);font-size:13.5px;margin-top:12px}
footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:26px 16px;font-size:14px;margin-top:30px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo" onclick="go('')">🎌 <b id="brand">Anime Uzbek</b></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Anime nomi yoki kodi..." autocomplete="off">
    </div>
    <a class="chan" id="chan" href="#" target="_blank" rel="noopener">📢 Kanal</a>
  </div>
</header>

<main class="wrap">
  <section id="home">
    <div class="chips">
      <h2 id="title">🆕 Yangi animelar</h2>
      <button class="chip on" data-sort="new">🆕 Yangi</button>
      <button class="chip" data-sort="top">🔥 Top</button>
      <button class="chip" data-sort="az">A–Z</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="detail" class="hidden"></section>
</main>

<footer>© <span id="year"></span> <span id="brand2">Anime Uzbek</span></footer>

<script>
const $ = s => document.querySelector(s);
let CFG = {brand:"Anime Uzbek", bot:"", channel:"#"};
let sort = "new", timer = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async u => { const r = await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); };

function go(code){ location.hash = code ? "#/a/" + encodeURIComponent(code) : "#/"; }

function skeleton(){ $("#grid").innerHTML = Array(10).fill('<div class="skel"></div>').join(""); }

async function loadList(){
  const q = $("#q").value.trim();
  skeleton();
  try{
    const list = await api("/api/animes?" + (q ? "q=" + encodeURIComponent(q) : "sort=" + sort));
    $("#title").textContent = q ? "🔎 Qidiruv natijalari" : ({new:"🆕 Yangi animelar", top:"🔥 Top animelar", az:"📚 Barcha animelar"})[sort];
    if(!list.length){
      $("#grid").innerHTML = '<div class="empty" style="grid-column:1/-1"><div>😔</div>Hech narsa topilmadi</div>';
      return;
    }
    $("#grid").innerHTML = list.map(a => `
      <a class="card" href="#/a/${encodeURIComponent(a.code)}">
        <div class="pic">
          <img src="${a.poster}" alt="${esc(a.name)}" loading="lazy">
          <span class="badge l">📺 ${a.eps} qism</span>
          ${a.rating ? `<span class="badge r">⭐ ${a.rating}</span>` : ""}
        </div>
        <h3>${esc(a.name)}</h3>
      </a>`).join("");
  }catch(e){
    $("#grid").innerHTML = '<div class="empty" style="grid-column:1/-1"><div>⚠️</div>Yuklab bo\'lmadi. Sahifani yangilang.</div>';
  }
}

async function loadDetail(code){
  const box = $("#detail");
  box.innerHTML = '<div class="empty">Yuklanmoqda...</div>';
  try{
    const a = await api("/api/anime/" + encodeURIComponent(code));
    document.title = a.name + " — " + CFG.brand;
    const eps = a.episodes.length
      ? `<div class="eps">${a.episodes.map(e => `<a class="ep" href="${e.link}" target="_blank" rel="noopener">${e.num}</a>`).join("")}</div>
         <p class="hint">Qism raqamini bossangiz, Telegram botda video ochiladi.</p>`
      : '<p class="hint">Qismlar tez orada qo\'shiladi.</p>';
    box.innerHTML = `
      <span class="back" onclick="go('')">← Orqaga</span>
      <div class="detail">
        <div class="dpic"><img src="${a.poster}" alt="${esc(a.name)}"></div>
        <div class="dinfo">
          <h1>${esc(a.name)}</h1>
          <div class="meta">
            <span class="pill">📺 <b>${a.episodes.length}</b> qism</span>
            <span class="pill star">⭐ <b>${a.rating_count ? a.rating : "—"}</b>${a.rating_count ? " (" + a.rating_count + ")" : ""}</span>
            <span class="pill">👁 <b>${a.views}</b></span>
          </div>
          <p class="descr">${esc(a.descr) || "Tavsif yo'q."}</p>
          <div class="actions">
            <a class="btn green" href="${a.bot_link}" target="_blank" rel="noopener">▶️ Botda ko'rish</a>
            <button class="btn blue" id="share">📤 Do'stlarga ulashish</button>
          </div>
          <h2>Qismlar</h2>
          ${eps}
        </div>
      </div>`;
    $("#share").onclick = async () => {
      const url = a.bot_link;
      if(navigator.share){ try{ await navigator.share({title:a.name, text:"🎬 " + a.name, url}); return; }catch(e){ if(e && e.name === "AbortError") return; } }
      window.open(a.share_link, "_blank");
    };
  }catch(e){
    box.innerHTML = '<span class="back" onclick="go(\'\')">← Orqaga</span><div class="empty"><div>😔</div>Anime topilmadi</div>';
  }
}

function route(){
  const m = location.hash.match(/^#\/a\/(.+)$/);
  if(m){
    $("#home").classList.add("hidden");
    $("#detail").classList.remove("hidden");
    window.scrollTo(0,0);
    loadDetail(decodeURIComponent(m[1]));
  }else{
    document.title = CFG.brand + " — anime o'zbek tilida";
    $("#detail").classList.add("hidden");
    $("#home").classList.remove("hidden");
    loadList();
  }
}

document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); sort = b.dataset.sort; $("#q").value = ""; loadList();
});
$("#q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => { if(location.hash.startsWith("#/a/")) location.hash = "#/"; else loadList(); }, 300);
});
window.addEventListener("hashchange", route);

(async () => {
  $("#year").textContent = new Date().getFullYear();
  try{
    CFG = await api("/api/config");
    $("#brand").textContent = CFG.brand; $("#brand2").textContent = CFG.brand;
    $("#chan").href = CFG.channel;
  }catch(e){}
  route();
})();
</script>
</body>
</html>
